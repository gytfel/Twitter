# Бесплатный запуск без своего сервера: GitHub Actions по расписанию.
# Ключи положи в Settings -> Secrets and variables -> Actions -> New repository secret.
name: autopost

on:
  schedule:
    # Время в UTC! Для Хельсинки (UTC+3 летом) вычитай 3 часа.
    - cron: '0 7 * * *'   # 10:00 по Хельсинки
    - cron: '0 12 * * *'  # 15:00
    - cron: '0 17 * * *'  # 20:00
  workflow_dispatch:      # кнопка ручного запуска

permissions:
  contents: write         # нужно, чтобы коммитить history.json обратно

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Publish post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTENT_MODE: file
          DRY_RUN: 'false'
        run: python main.py once

      - name: Save history
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "history: $(date -u +%F_%H:%M)"
          git push
